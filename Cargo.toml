[package]
name = "resonance"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Emergent life simulation engine — 8 axioms, 4 constants, cancer resistance from thermodynamics"
license = "AGPL-3.0-or-later"

[features]
default = []
bridge_optimizer = []
gpu_cell_field_snapshot = []
v6_fixed_tick = []
v6_collision_backend_3d = []
v7_worldgen = []
pixel_viewer = ["dep:minifb"]
md_3d = []
# Bins en migración a la API actual de Bevy 0.15 — gated para no romper
# `cargo test`/`cargo check` por defecto. Habilitar con `--features experimental_bins`.
experimental_bins = []
# Dev-only: linkea Bevy como shared lib → 60-80% faster incremental builds.
# Nunca usar en release (produce un .so/.dll dependency).
# Uso: `cargo run --bin <viz_bin> --features fast_compile`
fast_compile = ["bevy/dynamic_linking"]

[dependencies]
bevy = { version = "0.15", features = ["serialize"] }
glam = "0.29"
bytemuck = "1.25"
serde = { version = "1", features = ["derive"] }
ron = "0.8"
serde_json = "1"
fxhash = "0.2"
tracing = "0.1"
noise = "0.9"
oxidized_navigation = "0.12"
parry3d = "0.17"
rayon = "1.10"
bevy_egui = "0.31"
egui_plot = "0.29"
minifb = { version = "0.27", optional = true }

[profile.dev]
opt-level = 1
# El debuginfo completo de un binario Bevy es el driver dominante del pico de RAM
# del linker (~2-3 GB por link).  `line-tables-only` conserva file:line en panics
# y backtraces —lo único que se usa en la práctica— y descarta el resto.
# Full debuginfo for a Bevy binary is the dominant driver of linker peak RAM
# (~2-3 GB per link).  `line-tables-only` keeps file:line in panics/backtraces
# and drops everything else.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

# `cargo test` linkea decenas de test-binaries, cada uno estatizando Bevy entero.
# Sin debuginfo el pico por link baja a la mitad.  Los mensajes de `assert!` siguen
# reportando file:line (vienen de `#[track_caller]`, no del debuginfo).
# `cargo test` links dozens of test binaries, each statically embedding all of Bevy.
# Without debuginfo the per-link peak roughly halves.  `assert!` still reports
# file:line (that comes from `#[track_caller]`, not from debuginfo).
[profile.test]
debug = 0

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
naga = { version = "28", features = ["wgsl-in"] }
pollster = "0.4"
proptest = "1.4"
wgpu = { version = "23", default-features = true, features = ["wgsl"] }

# ── Binarios ──────────────────────────────────────────────────────────────────
#
# Los 28 bins se declaran explícitos (antes 15 quedaban auto-descubiertos desde
# `src/bin/*.rs` y eran invisibles acá).  Todos llevan `test = false` /
# `bench = false`: ninguno contiene `#[cfg(test)]`, así que sin esto `cargo test`
# y `cargo bench` linkeaban 28 harnesses vacíos —28 links de Bevy por nada—.
#
# All 28 bins are declared explicitly (15 used to be auto-discovered from
# `src/bin/*.rs` and were invisible here).  All carry `test = false` /
# `bench = false`: none contains `#[cfg(test)]`, so without this `cargo test` and
# `cargo bench` linked 28 empty harnesses — 28 Bevy links for nothing.

